<!doctype html>
<html lang="zh-CN">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="刘宇杰 | Yujie Liu 的学术主页">
    <meta name="color-scheme" content="light">
    <title>刘宇杰 | Yujie Liu</title>
    <link rel="icon" href="assets/favicons/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" href="assets/favicons/favicon-32.png" sizes="32x32">
    <link rel="stylesheet" href="styles.css">
    <script defer src="content.js"></script>

    <div class="page">

            <img src="assets/logos/xjtu.png" width="64" height="64" alt="西安交通大学" data-logo="xjtu">
          </a>
          <a href="https://www.whut.edu.cn/" target="_blank" rel="noopener noreferrer">
            <img src="assets/logos/whut.png" width="64" height="64" alt="武汉理工大学" data-logo="whut">
          </a>
        </div>
        <p class="random-greeting" id="random-greeting" lang="en">Hello!</p>
        <button class="language-switch" id="language-switch" type="button" lang="en" aria-label="Switch to English">English</button>
      </header>

      <nav class="section-nav" aria-label="栏目导航" id="section-nav">
        <a href="#about" data-section="about">个人简介</a>
        <a href="#research" data-section="research">研究方向</a>
        <a href="#education" data-section="education">教育经历</a>

          <div class="portrait-placeholder" id="portrait-placeholder" data-label="photo">照片</div>
          <img class="portrait" id="portrait" width="180" height="225" alt="刘宇杰" hidden>
          <h1 id="profile-name">刘宇杰</h1>
          <p id="profile-position">博士研究生（硕博连读）</p>
          <div class="affiliations" id="profile-affiliations"></div>
          <div class="contact">
            <p data-label="email">电子邮箱</p>
            <div id="profile-emails"></div>
            <ul class="profile-links" id="profile-links"></ul>
          </div>
        </aside>
        <main id="main-content" tabindex="-1"></main>
      </div>

      <footer class="site-footer">
        <div class="visitor-count" aria-live="polite">
          <span id="busuanzi_container_site_pv" style="display: none"><span data-label="pageViews">访问次数</span> <span id="busuanzi_value_site_pv"></span> <span data-label="viewUnit">次</span></span>
          <span id="busuanzi_container_site_uv" style="display: none"><span data-label="visitors">访客人数</span> <span id="busuanzi_value_site_uv"></span> <span data-label="visitorUnit">人</span></span>
